name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "${{ matrix.python }}"}
      - name: Install
        run: pip install --extra-index-url https://download.pytorch.org/whl/cpu -e ".[dev,surrogate,mcp]"
      - name: Lint
        run: ruff check src tests scripts recipes
      - name: Tests
        run: pytest -q
      - name: Smoke benchmark + replay check
        run: |
          sciagent bench --seeds 2 --budget 64 --out ci_bench
          sciagent run studies/reactor.yaml --planner llm --record --budget 64 --out runs/ci
          sciagent replay runs/ci
      - uses: actions/upload-artifact@v4
        with: {name: bench-${{ matrix.python }}, path: ci_bench}
  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t sciagent-bench .
      - run: |
          docker run -d -p 8000:8000 --name s sciagent-bench
          for i in $(seq 30); do curl -sf localhost:8000/api/health && break; sleep 1; done
          curl -sf -X POST localhost:8000/api/studies -H 'content-type: application/json' \
            -d '{"name":"docker","simulator":"reactor","budget":{"compute_units":40}}'
