name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false   # let both Python versions finish so a failure on one is visible on the other
      matrix:
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "${{ matrix.python }}"}
      - name: Install
        run: pip install --extra-index-url https://download.pytorch.org/whl/cpu -e ".[dev,surrogate,mcp]" transformers peft accelerate tokenizers
      - name: Lint
        run: ruff check src tests scripts recipes notebooks
      - name: Notebooks are generated from build_notebooks.py
        run: python notebooks/build_notebooks.py && git diff --exit-code notebooks/
      - name: Tests with coverage
        run: pytest -q -rfE --cov=sciagent --cov-report=term --cov-report=xml --junitxml=junit.xml
      - name: Replay check
        run: |
          sciagent run studies/reactor.yaml --planner llm --record --budget 64 --out runs/ci
          sciagent replay runs/ci
      - name: Experiment pipeline smoke run (CPU, fake teacher, tiny student)
        run: sciagent experiments --profile cpu-smoke --results ci_results
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ci-results-${{ matrix.python }}
          path: |
            junit.xml
            ci_results/report/TECHNICAL_REPORT.md
            ci_results/experiments_status.json
            coverage.xml
  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t sciagent-bench .
      - run: |
          docker run -d -p 8000:8000 -e SCIAGENT_API_TOKEN=ci --name sciagent-ci sciagent-bench
          for i in $(seq 60); do curl -sf localhost:8000/api/health && break; sleep 1; done || true
          docker logs sciagent-ci
          test "$(curl -s -o /dev/null -w '%{http_code}' localhost:8000/api/studies)" = "401"
          curl -sf -X POST localhost:8000/api/studies -H 'Authorization: Bearer ci' -H 'content-type: application/json' \
            -d '{"name":"docker","simulator":"reactor","budget":{"compute_units":40}}'
